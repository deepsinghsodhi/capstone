{% extends "base.html" %}

{% block title %}Results{% endblock %}

{% block content %}
    <h1>PDF Table Extractor </h1>
    <form action="{{ url_for('main.download_images') }}" method="post" id="downloadForm">
        <div class="table-container">
            {% for table in tables %}
            <div class="table-row">
                <input type="checkbox" name="selected_tables[]" value="{{ table }}" id="table_{{ loop.index }}">
                <label for="table_{{ loop.index }}">
                    <img src="{{ url_for('static', filename=table) }}" class="table-image">
                </label>
            </div>
            {% endfor %}
        </div>
        <div class="button-group">
            <button type="submit" class="download-btn">Download Selected Images</button>
        </div>
    </form>
    <a href="{{ url_for('main.upload_file') }}" class="back-btn">Process another PDF</a>
{% endblock %}

{% block extra_styles %}
<style>
    .table-row {
        display: flex;
        align-items: center;
        margin: 20px 0;
        gap: 20px;
    }
    
    input[type="checkbox"] {
        width: 20px;
        height: 20px;
    }
    
    .table-image {
        max-width: 90%;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    .button-group {
        margin: 20px 0;
        text-align: center;
    }
    
    .download-btn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    
    .download-btn:hover {
        background-color: #45a049;
    }

    .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #666;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }

    .back-btn:hover {
        background-color: #555;
    }
</style>
{% endblock %}
